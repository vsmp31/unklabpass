{% extends "base.html" %}

{% block content %}
<div class="page-grid">
    
    <!-- ─── Left Panel: CRUD Database ──────────────────────────────────────── -->
    <div class="panel">
        <h2 class="section-title">Manajemen Database Mobil</h2>
        <div class="section-subtitle">Tambah, ubah, atau hapus kendaraan terdaftar</div>

        <!-- Add Vehicle Form -->
        <div class="crud-form">
            <input type="text" id="input-plate" placeholder="Plat Nomor (ex: DB1234A)" class="up-input" autocomplete="off">
            <input type="text" id="input-name" placeholder="Nama Pemilik" class="up-input" autocomplete="off">
            <button id="btn-add" class="up-btn">Tambah Kendaraan</button>
        </div>

        <div id="crud-msg" class="toast"></div>

        <!-- Vehicle List -->
        <div class="vehicle-list-wrapper">
            <table class="up-table">
                <thead>
                    <tr>
                        <th>Plat Nomor</th>
                        <th>Nama Pemilik</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="vehicle-table-body">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ─── Right Panel: Real-Time Logs ────────────────────────────────────── -->
    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <div>
                <h2 class="section-title" style="text-align: left; margin-bottom: 0;">Gate Logs</h2>
                <div class="section-subtitle" style="text-align: left;">Histori kendaraan keluar-masuk gerbang</div>
            </div>
            <button id="btn-refresh-logs" class="refresh-btn" title="Refresh logs">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
        
        <div class="logs-container" id="logs-container">
            <!-- Loaded via JS -->
            <div class="spinner-wrap" id="logs-spinner">
                <div class="spinner"></div> Menunggu data...
            </div>
        </div>

        <!-- Pagination Controls -->
        <div class="pagination-controls hidden" id="pagination-controls">
            <button id="btn-prev" class="pagination-btn">← Prev</button>
            <span id="page-info" class="page-info">Page 1 of 1</span>
            <button id="btn-next" class="pagination-btn">Next →</button>
        </div>
    </div>

</div>

<script>
/* ─── Variables ──────────────────────────────────────────────────────────── */
const tableBody = document.getElementById('vehicle-table-body');
const logsContainer = document.getElementById('logs-container');
const btnAdd = document.getElementById('btn-add');
const inputPlate = document.getElementById('input-plate');
const inputName = document.getElementById('input-name');
const crudMsg = document.getElementById('crud-msg');

let editModePlate = null;
const btnCancel = document.createElement('button');
btnCancel.className = 'up-btn';
btnCancel.style.backgroundColor = '#6c757d';
btnCancel.style.marginLeft = '10px';
btnCancel.textContent = 'Batal';
btnCancel.style.display = 'none';
btnAdd.parentNode.appendChild(btnCancel);

btnCancel.onclick = () => {
    editModePlate = null;
    inputPlate.value = '';
    inputName.value = '';
    btnAdd.textContent = 'Tambah Kendaraan';
    btnCancel.style.display = 'none';
};

/* ─── Fetch & Render Vehicles ────────────────────────────────────────────── */
async function loadVehicles() {
    try {
        const res = await fetch('/api/vehicles');
        const data = await res.json();
        
        tableBody.innerHTML = '';
        if(data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="3" class="table-empty">Belum ada kendaraan</td></tr>`;
            return;
        }

        data.forEach(v => {
            const tr = document.createElement('tr');
            const safeName = v.name.replace(/'/g, "\\'");
            tr.innerHTML = `
                <td class="table-plate-cell">${v.plate}</td>
                <td>${v.name}</td>
                <td>
                    <button class="btn-edit" onclick="editVehicle('${v.plate}', '${safeName}')">Edit</button>
                    <button class="btn-delete" onclick="deleteVehicle('${v.plate}')">Hapus</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    } catch(err) {
        console.error("Gagal load vehicles", err);
    }
}

/* ─── Fetch & Render Logs ────────────────────────────────────────────────── */
let currentLogsJSON = "";
let currentPage = 1;
const perPage = 20;

async function loadLogs(page = currentPage) {
    try {
        const res = await fetch(`/api/logs?page=${page}&per_page=${perPage}`);
        const data = await res.json();
        
        if (!data.logs) {
            console.error("Invalid response format");
            return;
        }

        const logs = data.logs;
        const pagination = data.pagination;
        
        // Update current page
        currentPage = pagination.page;
        
        // Render logs
        logsContainer.innerHTML = '';
        if(logs.length === 0) {
            logsContainer.innerHTML = `<div class="empty-state">Belum ada histori logs</div>`;
            document.getElementById('pagination-controls').classList.add('hidden');
            return;
        }

        logs.forEach(log => {
            const div = document.createElement('div');
            const isReg = log.registered;
            const borderColor = isReg ? '#4caf50' : '#ff9800';
            const badgeClass = isReg ? 'badge-success' : 'badge-warning';
            const badgeText = isReg ? '✔ Terdaftar' : '⚠ Tidak Terdaftar';
            
            div.style.cssText = `
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 16px;
                background: rgba(255,255,255,0.03);
                border-radius: 8px;
                margin-bottom: 10px;
                border-left: 4px solid ${borderColor};
            `;
            
            const timeParts = log.time.split(' ');
            const dateStr = timeParts[0];
            const timeStr = timeParts[1] || '';

            div.innerHTML = `
                <div class="flex flex-col gap-2">
                    <div class="log-timestamp">
                        <i class="bi bi-clock"></i> ${timeStr} 
                        <span class="log-timestamp-date">${dateStr}</span>
                    </div>
                    <div class="log-plate-text">
                        ${log.plate}
                    </div>
                    ${isReg ? `
                    <div class="log-owner">
                        <i class="bi bi-person-badge"></i> ${log.name}
                    </div>
                    ` : ''}
                </div>
                <div>
                    <span class="log-badge ${badgeClass}">${badgeText}</span>
                </div>
            `;
            logsContainer.appendChild(div);
        });

        // Update pagination controls
        updatePaginationControls(pagination);
        
    } catch(err) {
        console.error("Gagal load logs", err);
    }
}

function updatePaginationControls(pagination) {
    const controls = document.getElementById('pagination-controls');
    const pageInfo = document.getElementById('page-info');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    
    if (pagination.total_pages <= 1) {
        controls.classList.add('hidden');
        return;
    }
    
    controls.classList.remove('hidden');
    pageInfo.textContent = `Page ${pagination.page} of ${pagination.total_pages} (${pagination.total} total)`;
    
    btnPrev.disabled = pagination.page <= 1;
    btnNext.disabled = pagination.page >= pagination.total_pages;
}

// Pagination button handlers
document.getElementById('btn-prev').addEventListener('click', () => {
    if (currentPage > 1) {
        loadLogs(currentPage - 1);
    }
});

document.getElementById('btn-next').addEventListener('click', () => {
    loadLogs(currentPage + 1);
});

// Manual refresh button handler
document.getElementById('btn-refresh-logs').addEventListener('click', function() {
    this.classList.add('spinning');
    loadLogs(currentPage).finally(() => {
        setTimeout(() => {
            this.classList.remove('spinning');
        }, 600);
    });
});

/* ─── Add Vehicle ────────────────────────────────────────────────────────── */
btnAdd.addEventListener('click', async () => {
    const plate = inputPlate.value.trim();
    const name = inputName.value.trim();
    if(!plate || !name) {
        showMsg('Plat dan Nama wajib diisi!', 'toast-warning');
        return;
    }

    try {
        let res, result;
        if (editModePlate) {
            res = await fetch('/api/vehicles', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({old_plate: editModePlate, new_plate: plate, name})
            });
            result = await res.json();
            if(result.success) {
                showMsg('Data berhasil diubah!', 'toast-success');
                btnCancel.click(); // Reset state
                loadVehicles();
            } else {
                showMsg('Gagal: ' + result.error, 'toast-error');
            }
        } else {
            res = await fetch('/api/vehicles', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({plate, name})
            });
            result = await res.json();
            if(result.success) {
                showMsg('Kendaraan berhasil ditambahkan!', 'toast-success');
                inputPlate.value = '';
                inputName.value = '';
                loadVehicles();
            } else {
                showMsg('Gagal: ' + result.error, 'toast-error');
            }
        }
    } catch (err) {
        showMsg('Terjadi kesalahan jaringan', 'toast-error');
    }
});

/* ─── Edit Vehicle ───────────────────────────────────────────────────────── */
window.editVehicle = function(plate, name) {
    editModePlate = plate;
    inputPlate.value = plate;
    inputName.value = name;
    btnAdd.textContent = 'Simpan Perubahan';
    btnCancel.style.display = 'inline-block';
    inputPlate.focus();
}

/* ─── Delete Vehicle ─────────────────────────────────────────────────────── */
window.deleteVehicle = async function(plate) {
    if(!confirm(`Yakin ingin menghapus kendaraan ${plate}?`)) return;
    
    try {
        const res = await fetch(`/api/vehicles/${plate}`, { method: 'DELETE' });
        const result = await res.json();
        if(result.success) {
            showMsg('Kendaraan dihapus!', 'toast-success');
            loadVehicles();
        } else {
            showMsg('Gagal menghapus: ' + result.error, 'toast-error');
        }
    } catch (err) {
        showMsg('Terjadi kesalahan jaringan', 'toast-error');
    }
}

/* ─── Helpers ────────────────────────────────────────────────────────────── */
function showMsg(text, typeClass) {
    crudMsg.textContent = text;
    crudMsg.className = `toast show ${typeClass}`;
    setTimeout(() => { crudMsg.className = 'toast'; }, 3000);
}

/* ─── Init & Polling ─────────────────────────────────────────────────────── */
loadVehicles();
loadLogs();

// Smart polling: Only poll when page is visible
let logsPollingInterval = null;

function startLogsPolling() {
    // Clear existing interval if any
    if (logsPollingInterval) {
        clearInterval(logsPollingInterval);
    }
    
    // Poll every 10 seconds (reduced from 2 seconds)
    logsPollingInterval = setInterval(() => {
        // Only poll if page is visible
        if (!document.hidden) {
            loadLogs();
        }
    }, 10000);
}

function stopLogsPolling() {
    if (logsPollingInterval) {
        clearInterval(logsPollingInterval);
        logsPollingInterval = null;
    }
}

// Start polling
startLogsPolling();

// Pause polling when page is hidden, resume when visible
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        stopLogsPolling();
    } else {
        loadLogs(); // Refresh immediately when page becomes visible
        startLogsPolling();
    }
});

// Stop polling when user leaves page
window.addEventListener('beforeunload', stopLogsPolling);

</script>
{% endblock %}
