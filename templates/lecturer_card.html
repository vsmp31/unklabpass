<div class="metric-card">
    <div style="display: flex; flex-direction: column; gap: 1.5rem; align-items: center; text-align: center;">
        <img src="{{ lecturer.image }}" alt="Photo" style="width: 150px; height: 150px; border-radius: 12px; background: #333;">
        <div>
            <h2 style="margin: 0; color: #FFFFFF; font-size: 1.8rem; font-weight: 400;">{{ lecturer.name }}</h2>
            <p style="margin: 10px 0; color: #FFFFFF; opacity: 0.6; font-size: 1rem;">{{ lecturer.department }}</p>
            <p style="margin: 0; color: #FFFFFF; font-size: 0.9rem;">{{ lecturer.position }}</p>
        </div>
    </div>
    
    <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
        <div style="background: #1A1A1A; padding: 1.2rem; border-radius: 8px;">
            <div style="font-size: 0.75rem; color: #FFFFFF; opacity: 0.4; text-transform: uppercase;">License Plate</div>
            <div style="font-size: 1.4rem; font-weight: 400; color: #FFFFFF;">{{ lecturer.plate }}</div>
        </div>
        <div style="background: #1A1A1A; padding: 1.2rem; border-radius: 8px;">
            <div style="font-size: 0.75rem; color: #FFFFFF; opacity: 0.4; text-transform: uppercase;">Status</div>
            <div style="font-size: 1.4rem; font-weight: 400; color: #FFFFFF;">{{ lecturer.status }}</div>
        </div>
    </div>
</div>
